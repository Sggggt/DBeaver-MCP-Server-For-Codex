[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dbeaver-database-mcp"
version = "0.9.2"
description = "Structured read-only MCP with database adapters for saved DBeaver connections"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["dbeaver", "mcp", "postgresql", "oracle", "sqlserver", "read-only"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "cryptography>=46,<47",
  "psycopg[binary]>=3.2,<4",
  "jsonschema>=4.23,<5",
  "tzdata>=2025.1",
  "pglast>=7,<8",
  "oracledb>=3,<4",
  "sqlglot>=28.10,<29",
  "python-tds>=1.17,<2",
]

[project.scripts]
dbeaver-database-mcp = "dbeaver_database_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbeaver_database_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/docs/query-schema.json",
  "/docs/query-examples.json",
  "/docs/sqlserver-query-examples.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
]
exclude = [
  "/tests",
  "/audit",
  "/verification",
  "/.runtime",
  "**/__pycache__/**",
  "**/*.pyc",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
